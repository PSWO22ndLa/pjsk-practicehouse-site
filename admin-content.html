<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每週挑戰賽／譜面工坊管理 - 練習屋</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Montserrat:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* 與 admin.html、admin-records.html 同一套設計語彙 */
  :root {
    --bg: #ffffff; --ink: #1c1c1e; --muted: #7b7b82; --line: #e7e7ea;
    --field: #fafafb; --hover: #f4f4f6; --danger: #b3261e; --pass: #1f6f43;
    --serif: "Lora", "Noto Serif TC", Georgia, serif;
    --sans: "Montserrat", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid #1c1c1e; outline-offset: 2px; }
  .hidden { display: none !important; }

  .topbar { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line);
            position: sticky; top: 0; background: var(--bg); z-index: 10; flex-wrap: wrap; }
  .brand { font-family: var(--serif); font-weight: 600; font-size: 18px; }
  .brand a { color: var(--muted); font-family: var(--sans); font-size: 13px; margin-left: 12px; text-decoration: none; }
  .brand a:hover { color: var(--ink); text-decoration: underline; }
  .spacer { flex: 1; }
  .who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .who img { width: 26px; height: 26px; border-radius: 50%; }

  .btn { background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 8px 16px; }
  .btn:hover { background: var(--hover); border-color: #d3d3d8; }
  .btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 500; }
  .btn-primary:hover { background: #000; }
  .btn-primary:disabled { opacity: .3; cursor: not-allowed; background: var(--ink); }
  .btn-ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--hover); color: var(--ink); }
  .btn-sm { padding: 4px 10px; font-size: 13px; }
  .btn-danger { color: var(--danger); }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); padding: 0 24px; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 18px; color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #e0a244; margin-left: 6px; vertical-align: 2px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 28px 0 12px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .form { border: 1px solid var(--line); background: var(--field); padding: 18px 20px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 16px; align-items: end; }
  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld label { font-size: 12px; color: var(--muted); }
  .fld input, .fld select, .fld textarea, .inp { background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 8px 9px; width: 100%; }
  .fld textarea { min-height: 64px; resize: vertical; }
  .form-actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .status { font-size: 13px; padding: 6px 0; color: var(--muted); }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--pass); }
  .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }

  .weekbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .weekbar select { min-width: 280px; }

  .song-line { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .song-line:first-child { border-top: none; }
  .song-line .nm { flex: 1; min-width: 180px; }
  .song-line .nm small { color: var(--muted); }
  .picker { position: relative; }
  .picker ul { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin: 2px 0 0; padding: 4px 0; list-style: none;
               max-height: 260px; overflow: auto; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .picker li { padding: 6px 10px; cursor: pointer; font-size: 14px; }
  .picker li:hover { background: var(--hover); }
  .picker li small { color: var(--muted); }

  .res-row { display: grid; grid-template-columns: minmax(160px, 1fr) repeat(4, 70px) 80px; gap: 8px; align-items: center; padding: 6px 0; }
  .res-row.score { grid-template-columns: minmax(160px, 1fr) 160px; }
  .res-row input { text-align: right; font-variant-numeric: tabular-nums; }
  .res-row .sum { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .res-head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  td.id { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  td.act { white-space: nowrap; text-align: right; }
  .empty { color: var(--muted); padding: 32px 8px; text-align: center; }
  .scroll { overflow-x: auto; }

  .gate { display: grid; place-items: center; height: 100vh; text-align: center; padding: 24px; }
  .gate h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0 0 12px; }
  .gate p { color: var(--muted); margin: 0 0 24px; line-height: 1.8; }
</style>
</head>
<body>
<div id="gate" class="gate hidden">
  <div>
    <h1 id="gateTitle">每週挑戰賽／譜面工坊管理</h1>
    <p id="gateMsg">此頁面僅開放委員使用。以 Discord 登入後將自動確認身分組。</p>
    <a class="btn btn-primary" id="gateBtn" href="#">以 Discord 登入</a>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">內容管理<a href="/admin.html">段位曲目</a><a href="/admin-records.html">挑戰紀錄</a></div>
    <div class="spacer"></div>
    <div id="status" class="status"></div>
    <button class="btn btn-primary" id="saveBtn" disabled>儲存變更</button>
    <div class="who">
      <img id="meAvatar" alt="" hidden>
      <span id="meName"></span>
      <a class="btn btn-ghost btn-sm" href="/api/auth/logout">登出</a>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-weekly" data-doc="weekly">每週挑戰賽<span class="dot hidden"></span></button>
    <button class="tab" role="tab" id="tab-workshop" data-doc="workshop">譜面工坊<span class="dot hidden"></span></button>
  </nav>

  <!-- ===== 每週挑戰賽 ===== -->
  <div class="wrap hidden" id="pane-weekly">
    <div class="weekbar">
      <select id="wSel" class="inp" aria-label="週次"></select>
      <button class="btn" id="wNew">新增週次</button>
      <button class="btn btn-ghost btn-danger" id="wDel">刪除此週</button>
      <a class="btn btn-ghost" id="wView" target="_blank" rel="noopener">檢視公開頁</a>
    </div>

    <div id="wEditor" class="hidden">
      <h2>週次設定</h2>
      <div class="form">
        <div class="form-grid">
          <div class="fld"><label for="wId">ID（網址用，小寫英數與 -）</label><input id="wId" maxlength="40"></div>
          <div class="fld"><label for="wTitle">標題（選填）</label><input id="wTitle" maxlength="60" placeholder="例：第 1 週"></div>
          <div class="fld"><label for="wStart">開始日（台灣時間 00:00）</label><input id="wStart" type="date"></div>
          <div class="fld"><label for="wEnd">結束日（台灣時間 23:59）</label><input id="wEnd" type="date"></div>
          <div class="fld"><label for="wMetric">計分方式</label>
            <select id="wMetric"><option value="penalty">扣血合計（低者為上）</option><option value="score">分數合計（高者為上）</option></select></div>
        </div>
        <div class="fld" style="margin-top:12px"><label for="wNote">附註（公開顯示，選填）</label><textarea id="wNote" maxlength="500"></textarea></div>

        <h2>指定曲目（1–5 首）</h2>
        <div id="wSongs"></div>
        <div class="form-grid" style="margin-top:10px">
          <div class="fld picker"><label for="wSongQ">加入曲目（輸入曲名）</label><input id="wSongQ" autocomplete="off"><ul id="wSongList" class="hidden"></ul></div>
        </div>
        <p class="hint">更換計分方式或曲目數量時，已登記的成績會被清空，請先確認。</p>
      </div>

      <h2>登記成績 <span id="eMode" style="text-transform:none;letter-spacing:0"></span></h2>
      <div class="form">
        <div class="form-grid">
          <div class="fld"><label for="eUid">Discord ID</label><input id="eUid" inputmode="numeric"></div>
          <div class="fld"><label for="eName">顯示名稱</label><input id="eName" maxlength="60"></div>
          <div class="fld"><label for="eDate">確認日期</label><input id="eDate" type="date"></div>
          <div class="fld"><label for="eProof">證明連結</label><input id="eProof" type="url" maxlength="300"></div>
        </div>
        <div id="eResults" style="margin-top:12px"></div>
        <div class="form-actions">
          <button class="btn btn-primary" id="eAdd">新增 / 更新</button>
          <button class="btn btn-ghost" id="eClear">清空表單</button>
          <span class="status" id="eMsg"></span>
        </div>
      </div>

      <h2>已登記 <span id="eCount" style="text-transform:none;letter-spacing:0"></span></h2>
      <div class="scroll">
        <table><thead><tr><th>#</th><th>玩家</th><th>Discord ID</th><th style="text-align:right">合計</th><th>日期</th><th>證明</th><th></th></tr></thead>
          <tbody id="eRows"></tbody></table>
      </div>
      <div id="eEmpty" class="empty hidden">尚無成績。</div>
    </div>
    <div id="wNone" class="empty hidden">尚無週次。按「新增週次」建立。</div>
  </div>

  <!-- ===== 譜面工坊 ===== -->
  <div class="wrap hidden" id="pane-workshop">
    <h2>新增／編輯作品 <span id="kMode" style="text-transform:none;letter-spacing:0"></span></h2>
    <div class="form">
      <div class="form-grid">
        <div class="fld"><label for="kTitle">作品名稱</label><input id="kTitle" maxlength="80"></div>
        <div class="fld picker"><label for="kSong">對應曲目（選填）</label><input id="kSong" autocomplete="off"><ul id="kSongList" class="hidden"></ul></div>
        <div class="fld"><label for="kAuthor">作者顯示名稱</label><input id="kAuthor" maxlength="60"></div>
        <div class="fld"><label for="kAuthorId">作者 Discord ID（選填）</label><input id="kAuthorId" inputmode="numeric"></div>
        <div class="fld"><label for="kLevel">等級（選填，1–45）</label><input id="kLevel" type="number" min="1" max="45"></div>
        <div class="fld"><label for="kDate">刊登日期</label><input id="kDate" type="date"></div>
        <div class="fld"><label for="kUrl">連結（https）</label><input id="kUrl" type="url" maxlength="300"></div>
        <div class="fld"><label for="kTags">標籤（逗號分隔，最多 6 個）</label><input id="kTags" placeholder="例：練習用, 高難度"></div>
      </div>
      <div class="fld" style="margin-top:12px"><label for="kDesc">說明（選填，500 字內）</label><textarea id="kDesc" maxlength="500"></textarea></div>
      <div class="form-actions">
        <button class="btn btn-primary" id="kAdd">新增</button>
        <button class="btn btn-ghost" id="kClear">清空表單</button>
        <span class="status" id="kMsg"></span>
      </div>
    </div>

    <h2>已刊登 <span id="kCount" style="text-transform:none;letter-spacing:0"></span></h2>
    <div class="scroll">
      <table><thead><tr><th>日期</th><th>作品</th><th>曲目</th><th>作者</th><th style="text-align:right">Lv</th><th>連結</th><th></th></tr></thead>
        <tbody id="kRows"></tbody></table>
    </div>
    <div id="kEmpty" class="empty hidden">尚無作品。</div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const JUDGES = ['great', 'good', 'bad', 'miss'];
  const DIFFS = ['easy', 'normal', 'hard', 'expert', 'master', 'append'];
  const ID_RX = /^\d{5,25}$/;
  const todayTPE = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const isHttps = (u) => { try { return new URL(u).protocol === 'https:'; } catch { return false; } };
  const fmt = (n) => Number(n).toLocaleString('en-US');

  const S = {
    active: 'weekly',
    docs: { weekly: { doc: null, sha: null, dirty: false }, workshop: { doc: null, sha: null, dirty: false } },
    songs: [], songById: new Map(), dmg: { great: 1, good: 2, bad: 3, miss: 5 },
    week: null,        // 目前編輯中的週次物件（doc.weeks 內的參照）
    editWork: null,    // 編輯中的作品 id
  };

  function setStatus(msg, kind = '') { $('status').textContent = msg || ''; $('status').className = 'status' + (kind ? ' ' + kind : ''); }
  const fmsg = (id) => (msg, kind = '') => { $(id).textContent = msg || ''; $(id).className = 'status' + (kind ? ' ' + kind : ''); };
  const eMsg = fmsg('eMsg'), kMsg = fmsg('kMsg');

  function markDirty(doc, on = true) {
    S.docs[doc].dirty = on;
    document.querySelector(`#tab-${doc} .dot`).classList.toggle('hidden', !on);
    $('saveBtn').disabled = !S.docs[S.active].dirty;
  }
  window.addEventListener('beforeunload', (e) => {
    if (S.docs.weekly.dirty || S.docs.workshop.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  function gate(title, msg, loggedIn = false) {
    $('gateTitle').textContent = title;
    $('gateMsg').textContent = msg;
    $('gateBtn').href = loggedIn ? '/api/auth/logout' : `/api/auth/login?next=${encodeURIComponent(location.pathname + location.search)}`;
    $('gateBtn').textContent = loggedIn ? '登出' : '以 Discord 登入';
    $('gate').classList.remove('hidden');
  }

  async function boot() {
    let me;
    try { me = await (await fetch('/api/auth/me', { credentials: 'same-origin' })).json(); }
    catch { return gate('無法連線', '請重新整理再試一次。'); }
    if (!me.loggedIn) return gate('每週挑戰賽／譜面工坊管理', '此頁面僅開放委員使用。以 Discord 登入後將自動確認身分組。');
    if (!me.admin) return gate('沒有編輯權限', `目前以 ${me.user.name} 登入，此帳號沒有委員身分組。`, true);

    $('meName').textContent = me.user.name;
    if (me.user.avatar) { $('meAvatar').src = me.user.avatar; $('meAvatar').hidden = false; }
    $('app').classList.remove('hidden');

    setStatus('載入中…');
    try {
      await Promise.all([loadDoc('weekly'), loadDoc('workshop'), loadCatalog()]);
      setStatus('');
    } catch (e) {
      return setStatus(`載入失敗：${e.message}`, 'err');
    }

    for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => switchTab(t.dataset.doc));
    $('saveBtn').addEventListener('click', save);
    bindWeekly();
    bindWorkshop();

    const q = new URLSearchParams(location.search);
    switchTab(q.get('doc') === 'workshop' ? 'workshop' : 'weekly');
    prefill(q);
  }

  async function loadDoc(doc) {
    const r = await fetch(`/api/content?doc=${doc}`, { credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) throw new Error(`${doc} HTTP ${r.status}`);
    const out = await r.json();
    S.docs[doc].doc = out.content;
    S.docs[doc].sha = out.sha;
    markDirty(doc, false);
  }

  async function loadCatalog() {
    const [songs, rank] = await Promise.all([
      fetch('/data/songs.json').then((r) => r.json()),
      fetch('/data/rank-songs.json', { cache: 'no-cache' }).then((r) => r.json()).catch(() => ({})),
    ]);
    S.songs = songs.songs.map((s) => ({ ...s, key: `${s.title} ${s.titleZh || ''} ${s.composer || ''} ${s.id}`.toLowerCase() }));
    S.songById = new Map(S.songs.map((s) => [s.id, s]));
    const d = rank.defaults?.damage;
    if (d) for (const j of JUDGES) if (typeof d[j] === 'number') S.dmg[j] = d[j];
  }

  function switchTab(doc) {
    S.active = doc;
    for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.doc === doc));
    $('pane-weekly').classList.toggle('hidden', doc !== 'weekly');
    $('pane-workshop').classList.toggle('hidden', doc !== 'workshop');
    $('saveBtn').disabled = !S.docs[doc].dirty;
    doc === 'weekly' ? renderWeekly() : renderWorks();
  }

  async function save() {
    const doc = S.active, d = S.docs[doc];
    $('saveBtn').disabled = true;
    setStatus('儲存中…');
    try {
      const r = await fetch(`/api/content?doc=${doc}`, {
        method: 'PUT', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sha: d.sha, content: d.doc }),
      });
      const out = await r.json().catch(() => ({}));
      if (r.status === 409) { setStatus(out.message || '資料已被他人修改，請重新整理。', 'err'); return; }
      if (!r.ok) { setStatus(out.errs ? out.errs.join('；') : (out.error || `HTTP ${r.status}`), 'err'); $('saveBtn').disabled = false; return; }
      d.sha = out.sha;
      markDirty(doc, false);
      setStatus(out.commit ? '已儲存。網站重新部署後約 1 分鐘生效。' : '已儲存（本機）。', 'ok');
    } catch {
      setStatus('連線失敗，請再試一次。', 'err');
      $('saveBtn').disabled = false;
    }
  }

  // ---------- 曲目搜尋（兩個分頁共用） ----------
  function picker(input, list, onPick) {
    const close = () => list.classList.add('hidden');
    input.addEventListener('input', () => {
      const kw = input.value.trim().toLowerCase();
      if (!kw) return close();
      const hits = S.songs.filter((s) => s.key.includes(kw)).slice(0, 15);
      list.innerHTML = hits.map((s) => `<li data-id="${s.id}">${esc(s.title)} <small>#${s.id}${s.titleZh ? ' ' + esc(s.titleZh) : ''}</small></li>`).join('');
      list.classList.toggle('hidden', !hits.length);
    });
    list.addEventListener('mousedown', (ev) => {
      const li = ev.target.closest('li');
      if (!li) return;
      ev.preventDefault();
      onPick(S.songById.get(Number(li.dataset.id)));
      close();
    });
    input.addEventListener('blur', close);
  }

  // =================== 每週挑戰賽 ===================
  const W = () => S.docs.weekly.doc;

  function totalOf(w, e) {
    if (w.metric === 'score') return e.results.reduce((a, r) => a + (r.score || 0), 0);
    return e.results.reduce((a, r) => a + JUDGES.reduce((b, j) => b + (r[j] || 0) * S.dmg[j], 0), 0);
  }

  function bindWeekly() {
    $('wSel').addEventListener('change', () => { S.week = W().weeks.find((w) => w.id === $('wSel').value); clearEntryForm(); renderWeekly(); });
    $('wNew').addEventListener('click', () => {
      // 預設下週一到週日
      const t = new Date(`${todayTPE()}T00:00:00Z`);
      const add = ((8 - t.getUTCDay()) % 7) || 7;
      const start = new Date(t.getTime() + add * 864e5).toISOString().slice(0, 10);
      const end = new Date(t.getTime() + (add + 6) * 864e5).toISOString().slice(0, 10);
      let id = start, n = 2;
      while (W().weeks.some((w) => w.id === id)) id = `${start}-${n++}`;
      const w = { id, title: '', start, end, metric: 'penalty', note: '', songs: [], entries: [] };
      W().weeks.unshift(w);
      S.week = w;
      markDirty('weekly');
      renderWeekly();
    });
    $('wDel').addEventListener('click', () => {
      if (!S.week) return;
      if (!confirm(`刪除週次「${S.week.title || S.week.id}」及其 ${S.week.entries.length} 筆成績？`)) return;
      W().weeks = W().weeks.filter((w) => w !== S.week);
      S.week = W().weeks[0] || null;
      markDirty('weekly');
      renderWeekly();
    });

    const bindField = (id, key, after) => $(id).addEventListener('change', () => {
      if (!S.week) return;
      const v = $(id).value.trim();
      if (key === 'id') {
        if (!/^[a-z0-9][a-z0-9-]{0,39}$/.test(v) || W().weeks.some((w) => w !== S.week && w.id === v)) {
          $(id).value = S.week.id; return setStatus('ID 無效或重複。', 'err');
        }
      }
      if (key === 'metric' && S.week.entries.length && !confirm('更換計分方式會清空已登記的成績，確定？')) { $(id).value = S.week.metric; return; }
      if (key === 'metric') S.week.entries = [];
      S.week[key] = v;
      markDirty('weekly');
      after ? after() : renderWeekSelect();
    });
    bindField('wId', 'id');
    bindField('wTitle', 'title');
    bindField('wStart', 'start');
    bindField('wEnd', 'end');
    bindField('wNote', 'note');
    bindField('wMetric', 'metric', renderWeekly);

    picker($('wSongQ'), $('wSongList'), (s) => {
      if (!S.week) return;
      if (S.week.songs.length >= 5) return setStatus('最多 5 首。', 'err');
      if (S.week.entries.length && !confirm('變更曲目數量會清空已登記的成績，確定？')) return;
      S.week.entries = [];
      const diff = s.levels.master != null ? 'master' : 'expert';
      S.week.songs.push({ id: s.id, title: s.title, difficulty: diff, level: s.levels[diff] ?? null, jacket: s.jacket });
      $('wSongQ').value = '';
      markDirty('weekly');
      renderWeekly();
    });

    $('wSongs').addEventListener('change', (ev) => {
      const sel = ev.target.closest('select[data-i]');
      if (!sel) return;
      const song = S.week.songs[Number(sel.dataset.i)];
      song.difficulty = sel.value;
      song.level = S.songById.get(song.id)?.levels?.[sel.value] ?? null;
      markDirty('weekly');
      renderWeekly();
    });
    $('wSongs').addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-act]');
      if (!b) return;
      const i = Number(b.dataset.i), songs = S.week.songs;
      if (b.dataset.act === 'up' && i > 0) [songs[i - 1], songs[i]] = [songs[i], songs[i - 1]];
      else if (b.dataset.act === 'down' && i < songs.length - 1) [songs[i + 1], songs[i]] = [songs[i], songs[i + 1]];
      else if (b.dataset.act === 'rm') {
        if (S.week.entries.length && !confirm('變更曲目數量會清空已登記的成績，確定？')) return;
        S.week.entries = [];
        songs.splice(i, 1);
      } else return;
      // 調換順序時同步調換每筆成績，結果才不會對錯曲目
      if (b.dataset.act !== 'rm') for (const e of S.week.entries) {
        const j = b.dataset.act === 'up' ? i - 1 : i + 1;
        [e.results[i], e.results[j]] = [e.results[j], e.results[i]];
      }
      markDirty('weekly');
      renderWeekly();
    });

    $('eResults').addEventListener('input', updateEntrySums);
    $('eAdd').addEventListener('click', addEntry);
    $('eClear').addEventListener('click', clearEntryForm);
    $('eRows').addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-uid]');
      if (!b) return;
      const e = S.week.entries.find((x) => x.userId === b.dataset.uid);
      if (b.dataset.act === 'edit') return loadEntry(e);
      if (!confirm(`刪除 ${e.name} 的成績？`)) return;
      S.week.entries = S.week.entries.filter((x) => x !== e);
      markDirty('weekly');
      renderEntries();
    });
  }

  function renderWeekSelect() {
    const weeks = W().weeks;
    $('wSel').innerHTML = weeks.map((w) => `<option value="${esc(w.id)}">${esc(w.title || w.id)}（${esc(w.start)} – ${esc(w.end)}）</option>`).join('');
    if (S.week) $('wSel').value = S.week.id;
  }

  function renderWeekly() {
    if (!S.week || !W().weeks.includes(S.week)) S.week = W().weeks[0] || null;
    renderWeekSelect();
    const w = S.week;
    $('wNone').classList.toggle('hidden', !!w);
    $('wEditor').classList.toggle('hidden', !w);
    $('wDel').disabled = !w;
    if (!w) return;
    $('wView').href = `/weekly.html?week=${encodeURIComponent(w.id)}`;
    $('wId').value = w.id; $('wTitle').value = w.title || ''; $('wStart').value = w.start; $('wEnd').value = w.end;
    $('wMetric').value = w.metric; $('wNote').value = w.note || '';

    $('wSongs').innerHTML = w.songs.length ? w.songs.map((s, i) => {
      const lv = S.songById.get(s.id)?.levels || {};
      return `<div class="song-line">
        <span class="nm">${i + 1}. ${esc(s.title)} <small>#${s.id}</small></span>
        <select data-i="${i}" class="inp" style="width:auto">${DIFFS.filter((d) => lv[d] != null).map((d) =>
          `<option value="${d}"${d === s.difficulty ? ' selected' : ''}>${d.toUpperCase()} ${lv[d]}</option>`).join('')}</select>
        <button class="btn btn-sm" data-act="up" data-i="${i}" aria-label="上移">↑</button>
        <button class="btn btn-sm" data-act="down" data-i="${i}" aria-label="下移">↓</button>
        <button class="btn btn-sm btn-ghost btn-danger" data-act="rm" data-i="${i}">移除</button>
      </div>`;
    }).join('') : '<p class="hint">尚未加入曲目。</p>';

    buildEntryInputs();
    renderEntries();
  }

  function buildEntryInputs(values) {
    const w = S.week;
    if (!w.songs.length) { $('eResults').innerHTML = '<p class="hint">請先加入曲目。</p>'; return; }
    const head = w.metric === 'score'
      ? '<div class="res-row score res-head"><span>曲目</span><span>分數</span></div>'
      : `<div class="res-row res-head"><span>曲目</span>${JUDGES.map((j) => `<span style="text-align:right">${j}</span>`).join('')}<span style="text-align:right">扣血</span></div>`;
    $('eResults').innerHTML = head + w.songs.map((s, i) => {
      const v = values?.[i] || {};
      return w.metric === 'score'
        ? `<div class="res-row score"><span>${esc(s.title)}</span><input class="inp" data-i="${i}" data-j="score" type="number" min="0" value="${v.score ?? ''}"></div>`
        : `<div class="res-row"><span>${esc(s.title)}</span>${JUDGES.map((j) =>
            `<input class="inp" data-i="${i}" data-j="${j}" type="number" min="0" value="${v[j] ?? 0}">`).join('')}<span class="sum" id="eSum${i}"></span></div>`;
    }).join('') + '<div class="res-row" style="font-weight:600"><span>合計</span><span></span><span></span><span></span><span></span><span class="sum" id="eTotal"></span></div>';
    updateEntrySums();
  }

  function readEntryResults() {
    const w = S.week;
    return w.songs.map((_, i) => {
      const get = (j) => { const el = $('eResults').querySelector(`input[data-i="${i}"][data-j="${j}"]`); return el && el.value !== '' ? Number(el.value) : NaN; };
      return w.metric === 'score' ? { score: get('score') } : Object.fromEntries(JUDGES.map((j) => [j, get(j)]));
    });
  }

  function updateEntrySums() {
    const w = S.week;
    if (!w || !w.songs.length) return;
    const res = readEntryResults();
    const t = totalOf(w, { results: res.map((r) => Object.fromEntries(Object.entries(r).map(([k, v]) => [k, Number.isFinite(v) ? v : 0]))) });
    if (w.metric !== 'score') res.forEach((r, i) => { $(`eSum${i}`).textContent = JUDGES.reduce((a, j) => a + (Number.isFinite(r[j]) ? r[j] : 0) * S.dmg[j], 0); });
    const tot = $('eTotal');
    if (tot) tot.textContent = fmt(t);
  }

  function clearEntryForm() {
    for (const id of ['eUid', 'eName', 'eProof']) $(id).value = '';
    $('eDate').value = todayTPE();
    $('eMode').textContent = '';
    $('eAdd').textContent = '新增 / 更新';
    eMsg('');
    if (S.week) buildEntryInputs();
  }

  function loadEntry(e) {
    $('eUid').value = e.userId; $('eName').value = e.name; $('eProof').value = e.proof || ''; $('eDate').value = e.date || todayTPE();
    $('eMode').textContent = `— 編輯 ${e.name}`;
    buildEntryInputs(e.results);
    $('eUid').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function addEntry() {
    const w = S.week;
    if (!w.songs.length) return eMsg('請先加入曲目。', 'err');
    const userId = $('eUid').value.trim(), name = $('eName').value.trim(), proof = $('eProof').value.trim(), date = $('eDate').value;
    if (!ID_RX.test(userId)) return eMsg('Discord ID 無效。', 'err');
    if (!name) return eMsg('請填寫顯示名稱。', 'err');
    if (proof && !isHttps(proof)) return eMsg('證明連結須為 https。', 'err');
    const results = readEntryResults();
    const okInt = (v, max) => Number.isInteger(v) && v >= 0 && v <= max;
    if (results.some((r) => (w.metric === 'score' ? !okInt(r.score, 99999999) : JUDGES.some((j) => !okInt(r[j], 99999))))) {
      return eMsg('成績須為 0 以上的整數。', 'err');
    }
    const entry = { userId, name, results, ...(proof ? { proof } : {}), ...(date ? { date } : {}) };
    const i = w.entries.findIndex((e) => e.userId === userId);
    if (i >= 0) w.entries[i] = entry; else w.entries.push(entry);
    markDirty('weekly');
    renderEntries();
    clearEntryForm();
    eMsg(i >= 0 ? `已更新 ${name}，記得按「儲存變更」。` : `已新增 ${name}，記得按「儲存變更」。`, 'ok');
  }

  function renderEntries() {
    const w = S.week;
    const asc = w.metric !== 'score';
    const rows = w.entries.map((e) => ({ e, t: totalOf(w, e) })).sort((a, b) => (asc ? a.t - b.t : b.t - a.t));
    $('eCount').textContent = rows.length ? `${rows.length} 筆` : '';
    $('eEmpty').classList.toggle('hidden', rows.length > 0);
    $('eRows').innerHTML = rows.map(({ e, t }, i) => `<tr>
      <td class="id">${i + 1}</td><td>${esc(e.name)}</td><td class="id">${esc(e.userId)}</td>
      <td class="num">${fmt(t)}</td><td class="id">${esc(e.date || '')}</td>
      <td>${e.proof ? `<a href="${esc(e.proof)}" target="_blank" rel="noopener noreferrer">開啟</a>` : ''}</td>
      <td class="act"><button class="btn btn-sm" data-act="edit" data-uid="${esc(e.userId)}">編輯</button>
        <button class="btn btn-sm btn-ghost btn-danger" data-act="del" data-uid="${esc(e.userId)}">刪除</button></td></tr>`).join('');
  }

  // =================== 譜面工坊 ===================
  const K = () => S.docs.workshop.doc;
  let kSongId = null;

  function bindWorkshop() {
    picker($('kSong'), $('kSongList'), (s) => { kSongId = s.id; $('kSong').value = s.title; });
    $('kSong').addEventListener('input', () => { kSongId = null; });
    $('kAdd').addEventListener('click', addWork);
    $('kClear').addEventListener('click', clearWorkForm);
    $('kRows').addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-id]');
      if (!b) return;
      const e = K().entries.find((x) => x.id === b.dataset.id);
      if (b.dataset.act === 'edit') return loadWork(e);
      if (!confirm(`刪除作品「${e.title}」？`)) return;
      K().entries = K().entries.filter((x) => x !== e);
      markDirty('workshop');
      renderWorks();
    });
    clearWorkForm();
  }

  function clearWorkForm() {
    for (const id of ['kTitle', 'kSong', 'kAuthor', 'kAuthorId', 'kLevel', 'kUrl', 'kTags', 'kDesc']) $(id).value = '';
    $('kDate').value = todayTPE();
    kSongId = null; S.editWork = null;
    $('kMode').textContent = ''; $('kAdd').textContent = '新增';
    kMsg('');
  }

  function loadWork(e) {
    S.editWork = e.id;
    $('kTitle').value = e.title; $('kAuthor').value = e.authorName; $('kAuthorId').value = e.authorId || '';
    $('kLevel').value = e.level ?? ''; $('kUrl').value = e.url; $('kTags').value = (e.tags || []).join(', ');
    $('kDesc').value = e.description || ''; $('kDate').value = e.date || todayTPE();
    kSongId = e.songId ?? null; $('kSong').value = e.songTitle || '';
    $('kMode').textContent = `— 編輯「${e.title}」`; $('kAdd').textContent = '更新';
    $('kTitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function addWork() {
    const title = $('kTitle').value.trim(), authorName = $('kAuthor').value.trim(), authorId = $('kAuthorId').value.trim();
    const url = $('kUrl').value.trim(), levelRaw = $('kLevel').value.trim(), date = $('kDate').value;
    const tags = [...new Set($('kTags').value.split(/[,，]/).map((t) => t.trim()).filter(Boolean))];
    const description = $('kDesc').value.trim();
    if (!title) return kMsg('請填寫作品名稱。', 'err');
    if (!authorName) return kMsg('請填寫作者名稱。', 'err');
    if (authorId && !ID_RX.test(authorId)) return kMsg('作者 Discord ID 無效。', 'err');
    if (!isHttps(url)) return kMsg('連結須為 https。', 'err');
    const level = levelRaw === '' ? null : Number(levelRaw);
    if (level != null && !(Number.isInteger(level) && level >= 1 && level <= 45)) return kMsg('等級須為 1–45 的整數。', 'err');
    if (tags.length > 6 || tags.some((t) => t.length > 16)) return kMsg('標籤最多 6 個、每個 16 字內。', 'err');
    if ($('kSong').value.trim() && kSongId == null) return kMsg('對應曲目請從清單選擇，或留空。', 'err');

    const song = kSongId != null ? S.songById.get(kSongId) : null;
    const entry = {
      id: S.editWork || `${(date || todayTPE()).replace(/-/g, '')}-${Math.random().toString(36).slice(2, 7)}`,
      title, authorName, url,
      ...(authorId ? { authorId } : {}),
      ...(song ? { songId: song.id, songTitle: song.title } : {}),
      ...(level != null ? { level } : {}),
      ...(description ? { description } : {}),
      ...(tags.length ? { tags } : {}),
      ...(date ? { date } : {}),
    };
    const i = K().entries.findIndex((e) => e.id === entry.id);
    if (i >= 0) K().entries[i] = entry; else K().entries.unshift(entry);
    markDirty('workshop');
    renderWorks();
    clearWorkForm();
    kMsg(`${i >= 0 ? '已更新' : '已新增'}「${title}」，記得按「儲存變更」。`, 'ok');
  }

  function renderWorks() {
    const rows = K().entries.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    $('kCount').textContent = rows.length ? `${rows.length} 件` : '';
    $('kEmpty').classList.toggle('hidden', rows.length > 0);
    $('kRows').innerHTML = rows.map((e) => `<tr>
      <td class="id">${esc(e.date || '')}</td><td>${esc(e.title)}</td><td>${esc(e.songTitle || '')}</td>
      <td>${esc(e.authorName)}</td><td class="num">${e.level ?? ''}</td>
      <td><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">開啟</a></td>
      <td class="act"><button class="btn btn-sm" data-act="edit" data-id="${esc(e.id)}">編輯</button>
        <button class="btn btn-sm btn-ghost btn-danger" data-act="del" data-id="${esc(e.id)}">刪除</button></td></tr>`).join('');
  }

  // =================== 從 Discord 通知連結預填 ===================
  function prefill(q) {
    const uid = q.get('uid'), name = (q.get('name') || '').slice(0, 60);
    if (q.get('doc') === 'workshop') {
      if (!q.get('title')) return;
      clearWorkForm();
      $('kTitle').value = (q.get('title') || '').slice(0, 80);
      $('kAuthor').value = name;
      if (uid && ID_RX.test(uid)) $('kAuthorId').value = uid;
      const url = q.get('url') || '';
      if (isHttps(url)) $('kUrl').value = url;
      const lv = Number(q.get('level'));
      if (Number.isInteger(lv) && lv >= 1 && lv <= 45) $('kLevel').value = lv;
      const s = S.songById.get(Number(q.get('song')));
      if (s) { kSongId = s.id; $('kSong').value = s.title; }
      $('kDesc').value = (q.get('desc') || '').slice(0, 500);
      kMsg('已從投稿通知預填。開啟連結確認內容後按「新增」，再按「儲存變更」。');
      return;
    }
    const w = W().weeks.find((x) => x.id === q.get('week'));
    if (!w || !uid || !ID_RX.test(uid)) return;
    S.week = w;
    renderWeekly();
    const parts = String(q.get('r') || '').split('_');
    const results = parts.length === w.songs.length ? parts.map((p) => {
      if (w.metric === 'score') return { score: Number(p) };
      const n = p.split('.').map(Number);
      return Object.fromEntries(JUDGES.map((j, k) => [j, n[k]]));
    }) : null;
    $('eUid').value = uid;
    $('eName').value = w.entries.find((e) => e.userId === uid)?.name || name;
    const proof = q.get('proof') || '';
    if (isHttps(proof)) $('eProof').value = proof;
    $('eDate').value = todayTPE();
    buildEntryInputs(results);
    const exists = w.entries.some((e) => e.userId === uid);
    $('eMode').textContent = exists ? '— 此玩家已有成績，將更新' : '';
    eMsg('已從投稿通知預填。開啟證明連結核對後按「新增 / 更新」，再按「儲存變更」。');
  }

  boot();
})();
</script>
</body>
</html>
