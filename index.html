  .menu-btn {

/* ???��??�環?��? */
.sidebar-user::before {
  content: '';
  position: absolute;
  left: -5px;
  top: -5px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #FF6B9D 0deg,
    #FFB3D9 120deg,
    #B3E5FF 240deg,
    #FF6B9D 360deg
  );
  opacity: 0;
  transition: opacity 0.3s ease;
  animation: rotate 3s linear infinite;
  z-index: 0;
}

.sidebar-user:hover::before {
  opacity: 0.6;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

function getNextLevelInfo(messageCount) {
  const levels = [
    0, 5, 12, 21, 32, 45, 60, 77, 96, 117,

    480, 525, 572, 621, 672, 725, 780, 837, 896, 957,

    1760, 1845, 1932, 2021, 2112, 2205, 2300, 2397, 2496, 2597,

    3840, 3965, 4092, 4221, 4352, 4485, 4620, 4757, 4896, 5037,

    6720, 6885, 7052, 7221, 7392, 7565, 7740, 7917, 8096, 8277,
    8460, 8645, 8832, 9021, 9212, 9405, 9600, 9797, 9996, 10197
  ];
  
  const currentLevel = calculateLevel(messageCount || 0);
  
  if (currentLevel >= levels.length) {
    return `已�??�高�?級�?`;
  }
  
  const nextLevelExp = levels[currentLevel];
  const remaining = nextLevelExp - (messageCount || 0);
  
  return `?�發 ${remaining} 次�??�可?�到 Lv.${currentLevel + 1}`;
}

function getLevelColor(level) {
  if (level < 30) return '#999999';  // ?�色 (Lv.1-29)
  else if (level < 50) return '#4A90E2';  // ?�色 (Lv.30-49)
  else if (level < 70) return '#9B59B6';  // 紫色 (Lv.50-69)
  else if (level < 90) return 'linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FFD700 100%)';  // ?�色 (Lv.70-89)
  else if (level < 100) return 'linear-gradient(135deg, #FF8C00 0%, #FF4500 100%)';  // 橙�? (Lv.90-99)
  else return 'linear-gradient(135deg, #FFF59D 0%, #FCC1C1 33%, #F9D4FF 66%, #70FFF8 100%)';  // 彩虹 (Lv.100+)
}

// ===== 導航?�能 =====
function navigateTo(page) {
  closeSidebar();

  if (page === 'home') {
    document.getElementById('mainContent').classList.remove('hidden');
    document.getElementById('profilePage').classList.remove('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (page === 'profile') {
    if (!currentUser) {
      alert('請�??�入!');
      return;
    }
    showProfile();
  } else {
    document.getElementById('mainContent').classList.remove('hidden');
    document.getElementById('profilePage').classList.remove('active');
    const section = document.getElementById(page);
    if (section) {
      const headerOffset = 80;
      const elementPosition = section.getBoundingClientRect().top;
      const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
      window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
    }
  }
}

function updateEquippedTitles() {
  const container = document.getElementById('equippedTitles');
  if (!container) return;

  container.innerHTML = '';
  
  for (let i = 0; i < 3; i++) {
    const titleId = equippedTitles[i];
    const slot = document.createElement('div');
    slot.className = 'title-slot';
    slot.dataset.slot = i;
    
    if (titleId && TITLE_DATABASE[titleId]) {
      const titleInfo = TITLE_DATABASE[titleId];
      slot.textContent = titleInfo.name;
      if (titleInfo.class) {
        slot.classList.add(titleInfo.class);
      }
      slot.onclick = () => unequipTitle(i);
    } else {
      slot.classList.add('empty');
      slot.textContent = '點�?裝�?稱�?';
      slot.onclick = () => openTitleModal(i);
    }
    
    container.appendChild(slot);
  }
}

  rootMargin: '0px 0px -80px 0px'
};

  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');

  });
}, observerOptions);
