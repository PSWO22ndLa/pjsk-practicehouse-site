<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青銅 - 段位挑戰</title>
<link rel="stylesheet" href="main.css">
<style>
  /* 段位詳細頁面樣式 */
  .rank-detail-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff97ee 0%, #ffc4ff 100%);
    padding: 100px 0 60px;
    position: relative;
  }

  /* 黑色半透明遮罩 */
  .rank-detail-page::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 0;
  }

  .detail-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }

  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }

  .rank-title-area {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .rank-badge {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 4px 15px rgba(255, 255, 255, 0.3));
  }

  .rank-badge img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .rank-title {
    font-size: 48px;
    font-weight: 900;
    color: white;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  .song-tabs {
    display: flex;
    gap: 10px;
  }

  .song-tab {
    width: 80px;
    height: 80px;
    background: rgba(255, 255, 255, 0.1);
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
  }

  .song-tab img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .song-tab-placeholder {
    font-size: 40px;
  }

  .song-tab:hover {
    transform: scale(1.05);
    border-color: rgba(255, 255, 255, 0.5);
  }

  .song-tab.active {
    border-color: white;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    transform: scale(1.1);
  }

  .detail-content {
    display: grid;
    grid-template-columns: 500px 1fr;
    gap: 30px;
  }

  .rules-section {
    background: rgba(30, 30, 30, 0.95);
    border-radius: 8px;
    padding: 40px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .rules-title {
    font-size: 28px;
    font-weight: 900;
    color: white;
    margin-bottom: 25px;
  }

  .rule-item {
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(40, 40, 40, 0.8);
    border-radius: 6px;
    border-left: 4px solid #3498db;
  }

  .rule-label {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 8px;
  }

  .rule-value {
    font-size: 24px;
    font-weight: 700;
    color: white;
  }

  .rule-value.limit {
    color: #e74c3c;
  }

  .rule-value.pass {
    color: #27ae60;
  }

  .songs-section {
    background: rgba(30, 30, 30, 0.95);
    border-radius: 8px;
    padding: 40px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .song-display {
    display: none;
  }

  .song-display.active {
    display: block;
  }

  .song-jacket-large {
    width: 100%;
    max-width: 500px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 30px;
    background: linear-gradient(135deg, #e0e0e0, #bdbdbd);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 150px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }

  .song-jacket-large img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }

  .song-name-large {
    font-size: 36px;
    font-weight: 900;
    color: white;
    margin-bottom: 25px;
    text-align: center;
  }

  .song-meta-large {
    display: grid;
    gap: 15px;
    max-width: 500px;
    margin: 0 auto 25px;
  }

  .song-meta-item-large {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 16px;
    color: #aaa;
    padding: 15px;
    background: rgba(40, 40, 40, 0.8);
    border-radius: 8px;
  }

  .song-meta-label-large {
    font-weight: 700;
    min-width: 80px;
    color: white;
  }

  .song-difficulty-large {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 25px;
  }

  .difficulty-badge {
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    color: white;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  .difficulty-badge.easy { background: #00FF00; }
  .difficulty-badge.normal { background: #0099FF; }
  .difficulty-badge.hard { background: #FFDD00; color: #000; }
  .difficulty-badge.expert { background: #FF4444; }
  .difficulty-badge.master { background: #9966FF; }
  .difficulty-badge.append { 
    background: linear-gradient(90deg, #FF33CC 0%, #CC00FF 100%);
  }

  .back-button {
    position: fixed;
    top: 100px;
    left: 20px;
    background: rgba(255, 255, 255, 0.2);
    width: 50px;
    height: 50px;
    border-radius: 6px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 100;
    text-decoration: none;
  }

  .back-button:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.1);
  }

  .back-button::before {
    content: '←';
    font-size: 24px;
    color: white;
    font-weight: 700;
  }

  @media (max-width: 1024px) {
    .detail-content {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 768px) {
    .rank-detail-page {
      padding: 80px 0 40px;
    }

    .detail-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 25px;
    }

    .rank-title-area {
      width: 100%;
    }

    .rank-badge {
      width: 50px;
      height: 50px;
    }

    .rank-title {
      font-size: 28px;
    }

    .song-tabs {
      width: 100%;
      justify-content: flex-start;
      overflow-x: auto;
      padding-bottom: 10px;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .song-tab {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-width: 2px;
    }

    .rules-section,
    .songs-section {
      padding: 25px 15px;
    }

    .rules-title {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .song-jacket-large {
      font-size: 100px;
    }

    .song-name-large {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .song-meta-item-large {
      font-size: 14px;
      padding: 12px 15px;
    }

    .song-meta-label-large {
      min-width: 60px;
      font-size: 14px;
    }

    .difficulty-badge {
      font-size: 16px;
      padding: 10px 18px;
    }
  }

  @media (max-width: 480px) {
    .detail-container {
      padding: 0 15px;
    }

    .rank-title {
      font-size: 24px;
    }

    .song-tab {
      width: 55px;
      height: 55px;
    }

    .song-jacket-large {
      font-size: 80px;
    }

    .song-name-large {
      font-size: 20px;
    }

    .song-meta-item-large {
      font-size: 13px;
      padding: 10px 12px;
    }
  }
</style>
</head>
<body data-tier="master2">
  <a href="rank-challenge.html" class="back-button"></a>

  <div class="rank-detail-page">
    <div class="detail-container">
      <div class="detail-header">
        <div class="rank-title-area">
          <div class="rank-badge">
            <img src="public/images/ranks/master.webp" alt="大師II">
          </div>
          <h1 class="rank-title">大師II</h1>
        </div>
        <div class="song-tabs" id="songTabs"></div>
      </div>

      <div class="detail-content">
        <div class="rules-section">
          <h2 class="rules-title">段位規則</h2>
          <div class="rule-item">
            <div class="rule-label">曲目數量</div>
            <div class="rule-value" data-rule="songCount">4 首</div>
          </div>
          <div class="rule-item">
            <div class="rule-label">血量</div>
            <div class="rule-value limit" data-rule="hp">100</div>
          </div>
          
          <!-- 血量扣法說明 -->
          <div style="margin-top: 30px;">
            <h3 style="font-size: 18px; font-weight: 700; color: white; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
              血量扣法
            </h3>
            <div style="background: rgba(40, 40, 40, 0.8); border-radius: 8px; padding: 20px;">
              <div style="display: grid; gap: 12px;" data-rule="damage"></div>
            </div>
          </div>
          <div class="rule-item" data-rule="special" style="display:none"></div>

          <!-- 立即預約按鈕 -->
          <a href="#" style="
            display: block;
            margin-top: 25px;
            padding: 16px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
          " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(102, 126, 234, 0.6)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(102, 126, 234, 0.4)'" data-reserve role="button">
            立即預約
          </a>
        </div>

        <div class="songs-section" id="songsSection"></div>
      </div>
    </div>
  </div>

  <script src="rank-page.js" defer></script>
</body>
</html>
